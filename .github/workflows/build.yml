name: Build YT-Blocker Payload

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and PS5 SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld wget unzip curl
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Fetch SQLite3 and cJSON sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source include
          wget -q https://www.sqlite.org/2024/sqlite-amalgamation-3450200.zip
          unzip -q -j sqlite-amalgamation-3450200.zip "*/sqlite3.c" -d source/
          unzip -q -j sqlite-amalgamation-3450200.zip "*/sqlite3.h" -d include/
          curl -fsSL https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c -o source/cJSON.c
          curl -fsSL https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h -o include/cJSON.h
          test -s source/sqlite3.c
          test -s include/sqlite3.h
          test -s source/cJSON.c
          test -s include/cJSON.h

      - name: Compile payload
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make
          test -s YT-Blocker.elf

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Blocker
          path: YT-Blocker.elf
          if-no-files-found: error
